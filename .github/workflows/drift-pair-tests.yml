name: Drift-pair helper tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  drift-pair-tests:
    # Staged helper tests only. Offline, no secrets, read-only token, no
    # counterpart code execution. The shared-drift-check workflow is unchanged.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Offline resolver and comparator controls
        run: |
          node --test scripts/drift-pair/resolve-pair.test.mjs
          node --test scripts/drift-pair/comparator-controls.test.mjs
          node --test scripts/drift-pair/activation.test.mjs
